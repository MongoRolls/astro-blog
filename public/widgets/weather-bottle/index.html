          let translucent = 0
          let solid = 0
          for (let i = 3; i < pixels.length; i += 4) {
            if (pixels[i] === 0)
              clear++
            else if (pixels[i] < 250)
              translucent++
            else solid++
          }
          const air = new T.Vector3(0.4, 0.2, 0.99).applyMatrix4(root.matrixWorld).project(camera)
          const x = Math.round((air.x + 1) / 2 * (width - 1))
          const y = Math.round((air.y + 1) / 2 * (height - 1))
          let rimAlpha = 0
          for (let i = 0; i < width; i++)
            rimAlpha = Math.max(rimAlpha, pixels[(y * width + i) * 4 + 3])
          return {
            clearRatio: clear / (width * height),
            translucentRatio: translucent / (width * height),
            solidRatio: solid / (width * height),
            glassAirAlpha: pixels[(y * width + x) * 4 + 3],
            rimAlpha,
            cornerAlphas: [3, width * 4 - 1, (height - 1) * width * 4 + 3, pixels.length - 1].map(i => pixels[i]),
          }
        },
        snapshot() {
          const p = topGeo.attributes.position
          let minY = Infinity
          let maxY = -Infinity
          let maxR = 0
          for (let i = 0; i < p.count; i++) {
            minY = Math.min(minY, p.getY(i))
            maxY = Math.max(maxY, p.getY(i))
            maxR = Math.max(maxR, Math.hypot(p.getX(i), p.getZ(i)))
          }
          let snowOutside = 0
          for (const p of snowflakes) {
            if (Math.hypot(p.x, p.z) > 0.96 || p.y > 1.1 || p.y < BOTTOM)
              snowOutside++
          }
          const boatBounds = new T.Box3()
          boat.updateMatrixWorld(true)
          let boatOutside = 0
          boat.traverse((o) => {
            if (o.isMesh && o.visible) {
              const a = o.geometry.attributes.position
              const point = new T.Vector3()
              for (let i = 0; i < a.count; i++) {
                point.fromBufferAttribute(a, i).applyMatrix4(o.matrixWorld)
                root.worldToLocal(point)
                if (
                  Math.hypot(point.x, point.z)
                  > innerRadius(point.y) - 0.01
                  || point.y < BOTTOM
                ) {
                  boatOutside++
                }
                boatBounds.expandByPoint(point)
              }
            }
          })
          const normalWorld = new T.Vector3(-slopeX, 1, -slopeZ)
            .normalize()
            .applyQuaternion(root.quaternion)
          return {
            disposed,
            outside,
            weather,
            liveMode,
            liveData,
            clearMix,
            fogMix,
            interaction: down ? 'observe' : 'rest',
            paused,
            time,
            rendered,
            yaw,
            tiltX,
            tiltZ,
            slopeX,
            slopeZ,
            normalWorld: normalWorld.toArray(),
            waveEnergy,
            shakeEnergy,
            snowMix,
            rainMix,
            stormMix,
            snowCover,
            snowHits,
            melted,
            rippleHits,
            flashCount,
            wipeCount,
            fogMean:
            fc
              .getImageData(0, 0, 512, 256)
              .data
              .filter((_, i) => i % 4 === 0)
              .reduce((a, b) => a + b, 0)
              / (512 * 256),
            water: { minY, maxY, maxR },
            boat: {
              x: boatX,
              z: boatZ,
              y: boat.position.y,
              waterY: waterHeight(boatX, boatZ),
              quaternion: boat.quaternion.toArray(),
              outside: boatOutside,
            },
            snowOutside,
            drawCalls: renderer.info.render.calls,
            triangles: renderer.info.render.triangles,
            dpr: renderer.getPixelRatio(),
            particles: SNOW + RAIN,
            width: stage.clientWidth,
            height: stage.clientHeight,
          }
        },
      }
    }
    listen(window, 'pageshow', () => {
      last = 0
      requestFrame()
    })
    listen(window, 'pagehide', (event) => {
      if (event.persisted) {
        cancelAnimationFrame(raf)
        raf = 0
        return
      }
      dispose()
    })
    message.hidden = true
    host.dataset.state = 'ready'
    setStatus()
    requestFrame()
  }
}

const params = new URLSearchParams(location.search);
const host = document.querySelector('[data-weather-scene]');
let current;
function mount() {
  current?.dispose();
  current = mountWeatherBottle(host, {
    locale: params.get('lang') || 'zh',
    dark: params.has('theme') ? params.get('theme') === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches,
    live: params.get('live') === '1',
    debug: params.get('debug') === '1',
    onRetry: mount,
  });
}
mount();
</script>
