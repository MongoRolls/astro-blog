<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="装着天气的玻璃瓶：一个可以旋转、摇晃与擦雾的 Three.js 微缩世界。"
    />
    <title>装着天气的玻璃瓶 · A bottle of weather</title>
    <style>
      :root {
        font-family:
          system-ui,
          -apple-system,
          "PingFang SC",
          sans-serif;
        color: #35483f;
        background: #eeeee6;
        --ink: #35483f;
        --muted: #68776e;
        --line: #b9c4b8;
        --panel: #f7f8efdd;
        --active: #3e594b;
        --on-active: #fffdf4;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.5;
      }
      button:focus-visible,
      a:focus-visible,
      #stage:focus-visible {
        outline: 2px solid #ae7247;
        outline-offset: 4px;
      }
      button {
        min-height: 44px;
        border: 0;
        background: transparent;
        border-radius: 22px;
        padding: 10px 16px;
        touch-action: manipulation;
      }
      button[aria-pressed="true"] {
        background: var(--active);
        color: var(--on-active);
      }
      svg {
        width: 18px;
        height: 18px;
        vertical-align: -4px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .app {
        position: relative;
        isolation: isolate;
        width: 100%;
        height: 100svh;
        min-height: 660px;
        overflow: hidden;
        background: radial-gradient(
          ellipse at 50% 42%,
          #fcfcf1 0,
          #e9ede4 58%,
          #e0e5db 100%
        );
      }
      header {
        position: absolute;
        top: 30px;
        left: 36px;
        right: 36px;
        z-index: 2;
        pointer-events: none;
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 20px;
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 12px;
      }
      h1 {
        font-family: "Songti SC", "Noto Serif SC", Georgia, serif;
        font-size: clamp(21px, 3vw, 30px);
        font-weight: 400;
        letter-spacing: 0.04em;
        margin: 0;
        line-height: 1.4;
      }
      .subhead {
        font-size: 12px;
        color: var(--muted);
        margin-top: 10px;
        line-height: 1.7;
      }
      .edition {
        text-align: right;
        font:
          italic 14px Georgia,
          serif;
        line-height: 1.8;
        color: var(--muted);
      }
      #stage {
        position: absolute;
        inset: 82px 0 155px;
        touch-action: none;
        cursor: grab;
        outline-offset: -5px;
      }
      #stage.wipe {
        cursor: crosshair;
      }
      #stage.dragging {
        cursor: grabbing;
      }
      #stage canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .bottle-note {
        position: absolute;
        right: max(24px, calc(50% - 300px));
        top: 48%;
        z-index: 1;
        pointer-events: none;
        font-size: 10px;
        letter-spacing: 0.17em;
        line-height: 1.9;
        color: #6f8277;
        writing-mode: vertical-rl;
      }
      .controls {
        position: absolute;
        bottom: 23px;
        left: 18px;
        right: 18px;
        z-index: 2;
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 12px;
      }
      .weather {
        display: flex;
        gap: 4px;
        padding: 5px;
        background: var(--panel);
        border: 1px solid #b9c4b878;
        border-radius: 32px;
        box-shadow: 0 8px 30px #43574709;
      }
      .weather button {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        min-width: 88px;
        font-size: 13px;
      }
      .tools {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .modes {
        display: flex;
        gap: 2px;
        border: 1px solid #b9c4b878;
        padding: 3px;
        border-radius: 25px;
      }
      .modes button {
        font-size: 11px;
        padding: 8px 13px;
        min-height: 36px;
      }
      .quiet {
        font-size: 11px;
        padding: 8px 10px;
        min-height: 40px;
      }
      .quiet:hover {
        background: #758c7812;
      }
      #hint {
        font-size: 11px;
        color: var(--muted);
        text-align: center;
        margin: 0;
        line-height: 1.6;
        max-width: 540px;
      }
      #status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 10px;
        letter-spacing: 0.09em;
        color: var(--muted);
      }
      #status:before {
        content: "";
        width: 5px;
        height: 5px;
        background: #809a82;
        border-radius: 50%;
      }
      .status-row {
        position: absolute;
        left: 36px;
        bottom: 32px;
        z-index: 2;
      }
      .corner {
        position: absolute;
        right: 36px;
        bottom: 32px;
        font:
          italic 12px Georgia,
          serif;
        color: var(--muted);
      }
      #message {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        z-index: 5;
        text-align: center;
        background: var(--panel);
        padding: 30px;
      }
      #message p {
        max-width: 380px;
        line-height: 1.8;
        margin: 0;
        font-size: 14px;
      }
      #message[hidden] {
        display: none;
      }
      #retry {
        border: 1px solid var(--line);
      }
      #retry[hidden] {
        display: none;
      }
      .local-weather {
        position: absolute;
        top: 135px;
        left: 36px;
        z-index: 2;
        max-width: 230px;
        font-size: 11px;
        line-height: 1.9;
        color: var(--muted);
      }
      .local-weather span {
        display: block;
      }
      .local-weather a {
        color: inherit;
        text-underline-offset: 3px;
      }
      .local-weather button {
        font-size: 10px;
        padding: 3px 10px;
        min-height: 32px;
        border: 1px solid var(--line);
        margin-top: 6px;
      }
      .embed .local-weather {
        top: 49px;
        left: 20px;
        font-size: 10px;
        max-width: 210px;
      }
      .embed .local-weather #weather-source {
        font-size: 9px;
      }
      @media (max-width: 600px) {
        .local-weather {
          top: 125px;
          left: 22px;
          font-size: 10px;
          max-width: 210px;
        }
        .app #stage {
          top: 150px;
        }
        .embed #stage {
          top: 82px;
        }
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .embed .app {
        min-height: 500px;
        height: 100svh;
      }
      .embed header {
        top: 18px;
        left: 20px;
        right: 20px;
      }
      .embed h1 {
        font-size: 18px;
      }
      .embed .eyebrow,
      .embed .subhead,
      .embed .edition,
      .embed .corner,
      .embed .bottle-note,
      .embed .status-row {
        display: none;
      }
      .embed #stage {
        inset: 40px 0 150px;
      }
      .embed .controls {
        bottom: 14px;
        gap: 8px;
      }
      .dark {
        --ink: #d5dfd3;
        --muted: #a9b9ac;
        --line: #56675b;
        --panel: #263a32e8;
        --active: #b8cabb;
        --on-active: #23352b;
        color: var(--ink);
        background: #1c2d28;
      }
      .dark .app {
        background: radial-gradient(
          ellipse at 50% 42%,
          #394d41 0,
          #263b32 55%,
          #1c2d28 100%
        );
      }
      .dark .bottle-note {
        color: #9bac9b;
      }
      .dark .weather,
      .dark .modes {
        border-color: #84998040;
      }
      .dark .quiet:hover {
        background: #bdcdbd14;
      }
      @media (max-width: 600px) {
        .app {
          min-height: 670px;
        }
        header {
          top: 24px;
          left: 22px;
          right: 22px;
        }
        .edition {
          display: none;
        }
        .subhead {
          font-size: 11px;
          max-width: 245px;
        }
        .status-row,
        .corner {
          display: none;
        }
        .bottle-note {
          right: 15px;
          font-size: 9px;
        }
        #stage {
          inset: 110px 0 170px;
        }
        .controls {
          bottom: 19px;
          gap: 10px;
        }
        .weather button {
          min-width: 82px;
          padding: 10px 13px;
        }
        .tools {
          gap: 2px;
        }
        .modes button {
          padding: 8px 11px;
        }
        .quiet {
          padding: 8px;
        }
        #hint {
          font-size: 10px;
          max-width: 310px;
        }
        .embed #stage {
          inset: 40px 0 160px;
        }
        .embed .app {
          min-height: 500px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header>
        <div>
          <p class="eyebrow">A QUIET LITTLE WORLD / 001</p>
          <h1 data-i18n="title">装着天气的玻璃瓶</h1>
          <p class="subhead" data-i18n="subtitle">把一小片天空，留在手心。</p>
        </div>
        <div class="edition">
          Weather, held gently.<br /><span
            style="font-size: 11px; font-style: normal; letter-spacing: 0.14em"
            >GLASS · WATER · WOOD</span
          >
        </div>
      </header>
      <div
        id="stage"
        tabindex="0"
        role="application"
        aria-label="可交互的天气玻璃瓶"
        aria-describedby="hint"
      ></div>
      <div class="local-weather" role="status">
        <span id="weather-data">默认场景 · 非实况</span
        ><span id="weather-source" hidden></span
        ><button type="button" id="live" hidden>当地天气</button>
      </div>
      <div class="bottle-note" aria-hidden="true">
        SOMEWHERE BETWEEN SEA & SKY
      </div>
      <div class="status-row">
        <span id="status" role="status">雪慢慢落下</span>
      </div>
      <div class="controls">
        <div class="weather" role="group" aria-label="瓶中天气">
          <button type="button" data-weather="rain" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M6 14a4 4 0 1 1 .5-8A5.5 5.5 0 0 1 17 8a3 3 0 0 1 1 6H6M8 17l-1 3m5-3-1 3m5-3-1 3"
              /></svg
            ><span data-i18n="rain">细雨</span>
          </button>
          <button type="button" data-weather="snow" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9 5l3 3 3-3M9 19l3-3 3 3M5 11l4-1-1-4M19 13l-4 1 1 4M5 13l4 1-1 4M19 11l-4-1 1-4"
              /></svg
            ><span data-i18n="snow">落雪</span>
          </button>
          <button type="button" data-weather="storm" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M6 13a4 4 0 1 1 .5-8A5.5 5.5 0 0 1 17 7a3 3 0 0 1 1 6h-2M12 10l-4 6h5l-2 6 6-8h-5l3-4"
              /></svg
            ><span data-i18n="storm">雷暴</span>
          </button>
        </div>
        <div class="tools">
          <div class="modes" role="group" aria-label="操作模式">
            <button
              type="button"
              data-mode="observe"
              aria-pressed="true"
              data-i18n="observe"
            >
              转动观察</button
            ><button
              type="button"
              data-mode="wipe"
              aria-pressed="false"
              data-i18n="wipe"
            >
              擦拭雾气
            </button>
          </div>
          <button class="quiet" id="shake" type="button" data-i18n="shake">
            轻摇一下</button
          ><button class="quiet" id="reset" type="button" data-i18n="reset">
            回正</button
          ><button
            class="quiet"
            id="pause"
            type="button"
            aria-pressed="false"
            data-i18n="pause"
          >
            暂停
          </button>
        </div>
        <p id="hint">拖动旋转与倾斜 · 快速往返摇出一场雪 · 方向键也可观察</p>
      </div>
      <span class="corner" aria-hidden="true">a small pause in your day</span>
      <div id="message" role="status">
        <p id="message-text">正在装入一小片天气…</p>
        <button id="retry" type="button" hidden>重新加载</button>
      </div>
      <noscript
        ><style>
          #message {
            display: none;
          }
        </style>
        <p style="position: relative; z-index: 10; padding: 30px">
          请启用 JavaScript 以查看天气玻璃瓶。Please enable JavaScript to use
          this scene.
        </p></noscript
      >
    </main>
    <script type="module">
      // One file, no assets or build step. Three.js is pinned; both CDNs serve the same module.
      const params = new URLSearchParams(location.search);
      const en = params.get("lang") === "en";
      const copy = {
        title: ["装着天气的玻璃瓶", "A bottle of weather"],
        subtitle: [
          "把一小片天空，留在手心。",
          "A small piece of sky, held in your hands.",
        ],
        rain: ["细雨", "Rain"],
        snow: ["落雪", "Snow"],
        storm: ["雷暴", "Storm"],
        observe: ["转动观察", "Observe"],
        wipe: ["擦拭雾气", "Wipe mist"],
        shake: ["轻摇一下", "Shake"],
        reset: ["回正", "Reset"],
        pause: ["暂停", "Pause"],
        resume: ["继续", "Play"],
        observeHint: [
          "拖动旋转与倾斜 · 快速往返摇出一场雪 · 方向键也可观察",
          "Drag to turn & tilt · Move back and forth to stir snow · Arrow keys work too",
        ],
        wipeHint: [
          "在瓶身上按住并擦拭 · 雾气会慢慢回来 · 切回观察可转动瓶子",
          "Press and wipe the glass · Mist slowly returns · Switch to Observe to turn",
        ],
        clearStatus: ["一片晴朗的天空", "A little clear sky"],
        cloudStatus: ["云在慢慢走", "Clouds drifting by"],
        fogStatus: ["雾中的安静时刻", "A quiet mist"],
        quiet: ["雪慢慢落下", "Snow, falling softly"],
        rainStatus: ["听一场小雨", "A little rain"],
        stormStatus: ["远处有雷声的天空", "A passing storm"],
        shakeStatus: ["一场小小的暴风雪", "A tiny snowstorm"],
        paused: ["时间暂时停住", "A moment, paused"],
        loading: ["正在装入一小片天气…", "Gathering a little weather…"],
        retry: ["重新加载", "Reload"],
        loadError: [
          "Three.js 加载失败。请检查网络是否允许访问 jsDelivr 或 unpkg，然后重试。",
          "Three.js could not load. Check your connection to jsDelivr or unpkg, then retry.",
        ],
        gpuError: [
          "无法启动 3D 场景。请使用支持 WebGL 2 的浏览器并开启硬件加速。",
          "Unable to start 3D. Use a browser with WebGL 2 and enable hardware acceleration.",
        ],
        lost: [
          "图形上下文已丢失。请重新加载以恢复瓶中天气。",
          "The graphics context was lost. Reload to restore the scene.",
        ],
      };
      const tr = (key) => copy[key][en ? 1 : 0];
      document.documentElement.lang = en ? "en" : "zh-CN";
      document.title = tr("title");
      document
        .querySelectorAll("[data-i18n]")
        .forEach((el) => (el.textContent = tr(el.dataset.i18n)));
      const embed = params.get("embed") === "1";
      document.documentElement.classList.toggle("embed", embed);
      let dark =
        params.get("theme") === "dark" ||
        (!params.has("theme") &&
          matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
      const stage = document.querySelector("#stage");
      const message = document.querySelector("#message");
      const messageText = document.querySelector("#message-text");
      const retry = document.querySelector("#retry");
      const hint = document.querySelector("#hint");
      const status = document.querySelector("#status");
      stage.setAttribute(
        "aria-label",
        en
          ? "Interactive weather bottle. Drag or use arrow keys to observe."
          : "可交互天气玻璃瓶，拖动或使用方向键观察",
      );
      document
        .querySelector(".weather")
        .setAttribute("aria-label", en ? "Weather" : "瓶中天气");
      document
        .querySelector(".modes")
        .setAttribute("aria-label", en ? "Interaction mode" : "操作模式");
      hint.textContent = tr("observeHint");
      messageText.textContent = tr("loading");
      retry.textContent = tr("retry");
      retry.onclick = () => location.reload();
      const controls = [...document.querySelectorAll(".controls button")];
      controls.forEach((button) => (button.disabled = true));
      function fail(key, error) {
        message.hidden = false;
        message.setAttribute("role", "alert");
        messageText.textContent = tr(key);
        retry.hidden = false;
        controls.forEach((button) => (button.disabled = true));
        document.documentElement.dataset.state = "error";
        console.error(error);
      }
      const cdns = [
        "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "https://unpkg.com/three@0.170.0/build/three.module.js",
      ];
      let THREE;
      try {
        for (const url of cdns) {
          let timeout;
          try {
            THREE = await Promise.race([
              import(url),
              new Promise((_, reject) => {
                timeout = setTimeout(
                  () => reject(new Error("CDN timeout")),
                  9000,
                );
              }),
            ]);
            break;
          } catch (error) {
            if (url === cdns.at(-1)) throw error;
          } finally {
            clearTimeout(timeout);
          }
        }
      } catch (error) {
        fail("loadError", error);
      }
      if (THREE) {
        try {
          start(THREE);
        } catch (error) {
          fail("gpuError", error);
        }
      }

      function start(T) {
        const clamp = T.MathUtils.clamp,
          lerp = T.MathUtils.lerp;
        const mobile =
          matchMedia("(pointer: coarse)").matches || innerWidth < 600;
        const motion = matchMedia("(prefers-reduced-motion: reduce)");
        let reduced = motion.matches,
          paused = reduced,
          outside = false,
          alive = true,
          raf = 0,
          last = 0,
          time = 0,
          accumulator = 0;
        const renderer = new T.WebGLRenderer({
          antialias: true,
          alpha: true,
          powerPreference: "low-power",
        });
        if (!renderer.extensions.has("EXT_color_buffer_float"))
          throw new Error("Floating-point render targets are unavailable");
        renderer.setPixelRatio(Math.min(devicePixelRatio, mobile ? 1.25 : 1.6));
        renderer.outputColorSpace = T.SRGBColorSpace;
        renderer.toneMapping = T.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        stage.append(renderer.domElement);
        renderer.domElement.setAttribute("aria-hidden", "true");
        renderer.domElement.addEventListener("webglcontextlost", (event) => {
          event.preventDefault();
          alive = false;
          cancelAnimationFrame(raf);
          fail("lost", new Error("WebGL context lost"));
        });
        const scene = new T.Scene(),
          root = new T.Group();
        scene.add(root);
        const camera = new T.PerspectiveCamera(35, 1, 0.1, 40);
        camera.position.set(3.2, 1.65, 6.8);
        camera.lookAt(0, 0.2, 0);
        const hemi = new T.HemisphereLight(0xe6f5ff, 0x786b4e, 1.8);
        scene.add(hemi);
        const key = new T.DirectionalLight(0xfff4da, 2.8);
        key.position.set(-3, 5, 4);
        scene.add(key);
        const rim = new T.DirectionalLight(0xb9e4e3, 2.0);
        rim.position.set(3, 2, -3);
        scene.add(rim);
        const flash = new T.PointLight(0xc9dfff, 0, 7, 2);
        flash.position.set(0, 0.8, 0.2);
        root.add(flash);
        // Procedural studio environment: broad softboxes, a warm horizon and a cool ceiling.
        const envCanvas = document.createElement("canvas");
        envCanvas.width = 512;
        envCanvas.height = 256;
        const ec = envCanvas.getContext("2d");
        const eg = ec.createLinearGradient(0, 0, 0, 256);
        eg.addColorStop(0, "#c9dfe4");
        eg.addColorStop(0.48, "#f0f0de");
        eg.addColorStop(0.53, "#8a9e91");
        eg.addColorStop(1, "#4c6053");
        ec.fillStyle = eg;
        ec.fillRect(0, 0, 512, 256);
        for (const [x, w] of [
          [70, 36],
          [320, 65],
          [470, 10],
        ]) {
          const g = ec.createLinearGradient(x - w, 0, x + w, 0);
          g.addColorStop(0, "#ffffff00");
          g.addColorStop(0.5, "#ffffff");
          g.addColorStop(1, "#ffffff00");
          ec.fillStyle = g;
          ec.fillRect(x - w, 30, w * 2, 155);
        }

                      ? "rain"
                      : null;
        function showWeatherData() {
          const fresh =
            liveData && Date.now() - liveData.observedAt < 2 * 60 * 60 * 1000;
          sourceLabel.hidden = !fresh;
          if (fresh) {
            const place =
              liveData.place ||
              liveData.country ||
              (en ? "Nearby region" : "大致地区");
            dataLabel.textContent = `${liveMode ? (en ? "Local weather" : "当地天气") : en ? "Demo scene · Local data" : "演示场景 · 当地数据"} · ${place}  ${Math.round(liveData.temperature)}°C · ${en ? "Humidity" : "湿度"} ${Math.round(liveData.humidity)}%`;
            const date = new Date(liveData.observedAt).toLocaleTimeString(
              en ? "en-GB" : "zh-CN",
              { hour: "2-digit", minute: "2-digit" },
            );
            sourceLabel.replaceChildren(
              document.createTextNode(
                `${en ? "Approx. IP region · VPN may affect it" : "IP 大致地区 · 可能受 VPN 影响"} · ${date} · `,
              ),
            );
            const a = document.createElement("a");
            a.href = "https://open-meteo.com/";
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.textContent = "Open-Meteo";
            sourceLabel.append(a);
          } else {
            dataLabel.textContent = en
              ? "Default scene · Demo weather"
              : "默认场景 · 非实况";
            sourceLabel.replaceChildren();
          }
          liveButton.hidden = !siteWeather;
          liveButton.textContent = liveMode
            ? en
              ? "Refresh weather"
              : "刷新天气"
            : en
              ? "Local weather"
              : "当地天气";
        }
        function applyLive() {
          if (!liveData) return;
          liveMode = true;
          weather = weatherCode(liveData.code);
          document
            .querySelectorAll("[data-weather]")
            .forEach((b) =>
              b.setAttribute(
                "aria-pressed",
                String(b.dataset.weather === weather),
              ),
            );
          if (paused) {
            snowMix = weather === "snow" ? 1 : 0;
            rainMix = ["rain", "storm"].includes(weather) ? 1 : 0;
            stormMix = weather === "storm" ? 1 : 0;
            clearMix = weather === "clear" ? 1 : 0;
            fogMix = weather === "fog" ? 1 : 0;
          }
          setStatus();
          showWeatherData();
          requestFrame();
        }
        async function loadWeather() {
          if (!siteWeather || document.hidden) return;
          if (lastWeatherRequest && Date.now() - lastWeatherRequest < 60000) {
            if (liveData) applyLive();
            return;
          }
          lastWeatherRequest = Date.now();
          const id = ++weatherRequestId;
          weatherRequest?.abort();
          weatherRequest = new AbortController();
          const timeout = setTimeout(() => weatherRequest.abort(), 6500);
          liveButton.disabled = true;
          try {
            const response = await fetch("/api/weather", {
              signal: weatherRequest.signal,
              credentials: "omit",
              cache: "no-store",
            });
            if (!response.ok) throw new Error("Weather unavailable");
            const data = await response.json();
            if (
              !data.available ||
              typeof data.temperature !== "number" ||
              !Number.isFinite(data.temperature) ||
              typeof data.humidity !== "number" ||
              data.humidity < 0 ||
              data.humidity > 100 ||
              !weatherCode(data.code) ||
              !Number.isFinite(data.observedAt) ||
              Math.abs(Date.now() - data.observedAt) > 2 * 60 * 60 * 1000
            )
              throw new Error("Weather unavailable");
            if (id !== weatherRequestId) return;
            liveData = data;
            applyLive();
          } catch {
            if (id !== weatherRequestId) return;
            liveData = null;
            liveMode = false;
            weather = "snow";
            document
              .querySelectorAll("[data-weather]")
              .forEach((b) =>
                b.setAttribute(
                  "aria-pressed",
                  String(b.dataset.weather === "snow"),
                ),
              );
            if (paused) {
              snowMix = 1;
              rainMix = stormMix = clearMix = fogMix = 0;
            }
            showWeatherData();
            setStatus();
            requestFrame();
          } finally {
            clearTimeout(timeout);
            liveButton.disabled = false;
          }
        }
        liveButton.onclick = () => {
          if (
            liveData &&
            !liveMode &&
            Date.now() - liveData.fetchedAt < 15 * 60 * 1000
          )
            applyLive();
          else loadWeather();
        };
        showWeatherData();
        if (siteWeather) {
          loadWeather();
          weatherTimer = setInterval(
            () => {
              if (!document.hidden && liveMode) loadWeather();
              else showWeatherData();
            },
            15 * 60 * 1000,
          );
        }
        // Read-only opt-in diagnostics keep browser regression tests grounded in real scene geometry.
        if (params.has("debug"))
          window.__weatherBottle = {
            snapshot() {
              const p = topGeo.attributes.position;
              let minY = Infinity,
                maxY = -Infinity,
                maxR = 0;
              for (let i = 0; i < p.count; i++) {
                minY = Math.min(minY, p.getY(i));
                maxY = Math.max(maxY, p.getY(i));
                maxR = Math.max(maxR, Math.hypot(p.getX(i), p.getZ(i)));
              }
              let snowOutside = 0;
              for (const p of snowflakes)
                if (Math.hypot(p.x, p.z) > 0.96 || p.y > 1.1 || p.y < BOTTOM)
                  snowOutside++;
              const boatBounds = new T.Box3();
              boat.updateMatrixWorld(true);
              let boatOutside = 0;
              boat.traverse((o) => {
                if (o.isMesh && o.visible) {
                  const a = o.geometry.attributes.position;
                  const point = new T.Vector3();
                  for (let i = 0; i < a.count; i++) {
                    point.fromBufferAttribute(a, i).applyMatrix4(o.matrixWorld);
                    root.worldToLocal(point);
                    if (
                      Math.hypot(point.x, point.z) >
                        innerRadius(point.y) - 0.01 ||
                      point.y < BOTTOM
                    )
                      boatOutside++;
                    boatBounds.expandByPoint(point);
                  }
                }
              });
              const normalWorld = new T.Vector3(-slopeX, 1, -slopeZ)
                .normalize()
                .applyQuaternion(root.quaternion);
              return {
                weather,
                liveMode,
                liveData,
                clearMix,
                fogMix,
                mode,
                paused,
                time,
                rendered,
                yaw,
                tiltX,
                tiltZ,
                slopeX,
                slopeZ,
                normalWorld: normalWorld.toArray(),
                waveEnergy,
                shakeEnergy,
                snowMix,
                rainMix,
                stormMix,
                snowCover,
                snowHits,
                melted,
                rippleHits,
                flashCount,
                wipeCount,
                fogMean:
                  fc
                    .getImageData(0, 0, 512, 256)
                    .data.filter((_, i) => i % 4 === 0)
                    .reduce((a, b) => a + b, 0) /
                  (512 * 256),
                water: { minY, maxY, maxR },
                boat: {
                  x: boatX,
                  z: boatZ,
                  y: boat.position.y,
                  waterY: waterHeight(boatX, boatZ),
                  quaternion: boat.quaternion.toArray(),
                  outside: boatOutside,
                },
                snowOutside,
                drawCalls: renderer.info.render.calls,
                triangles: renderer.info.render.triangles,
                dpr: renderer.getPixelRatio(),
                particles: SNOW + RAIN,
                width: stage.clientWidth,
                height: stage.clientHeight,
              };
            },
          };
        window.addEventListener("pageshow", () => {
          last = 0;
          requestFrame();
        });
        window.addEventListener(
          "pagehide",
          (event) => {
            if (event.persisted) {
              cancelAnimationFrame(raf);
              raf = 0;
              return;
            }
            weatherRequest?.abort();
            clearInterval(weatherTimer);
            alive = false;
            cancelAnimationFrame(raf);
            resize.disconnect();
            observer.disconnect();
            renderer.dispose();
            target.dispose();
            env.dispose();
            envTex.dispose();
          },
          { once: true },
        );
        controls.forEach((button) => (button.disabled = false));
        message.hidden = true;
        document.documentElement.dataset.state = "ready";
        setStatus();
        requestFrame();
      }
    </script>
  </body>
</html>
