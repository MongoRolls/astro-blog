<div class="app">
  <header>
    <div>
      <p class="eyebrow">A QUIET LITTLE WORLD / 001</p>
      <h2 data-i18n="title">装着天气的玻璃瓶</h2>
      <p class="subhead" data-i18n="subtitle">把一小片天空，留在手心。</p>
    </div>
    <div class="edition">
      Weather, held gently.<br /><span
        style="font-size: 11px; font-style: normal; letter-spacing: 0.14em"
        >GLASS · WATER · WOOD</span
      >
    </div>
  </header>
  <div
    data-bottle-part="stage"
    tabindex="0"
    role="application"
    aria-label="可交互的天气玻璃瓶"

  ></div>
  <div class="local-weather" role="status">
    <span data-bottle-part="weather-data">默认场景 · 非实况</span
    ><span data-bottle-part="weather-source" hidden></span
    ><button type="button" data-bottle-part="live" hidden>当地天气</button>
  </div>
  <div class="bottle-note" aria-hidden="true">
    SOMEWHERE BETWEEN SEA & SKY
  </div>
  <div class="status-row">
    <span data-bottle-part="status" role="status">雪慢慢落下</span>
  </div>
  <div class="controls">
    <div class="weather" role="group" aria-label="瓶中天气">
      <button type="button" data-weather="rain" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M6 14a4 4 0 1 1 .5-8A5.5 5.5 0 0 1 17 8a3 3 0 0 1 1 6H6M8 17l-1 3m5-3-1 3m5-3-1 3"
          /></svg
        ><span data-i18n="rain">细雨</span>
      </button>
      <button type="button" data-weather="snow" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9 5l3 3 3-3M9 19l3-3 3 3M5 11l4-1-1-4M19 13l-4 1 1 4M5 13l4 1-1 4M19 11l-4-1 1-4"
          /></svg
        ><span data-i18n="snow">落雪</span>
      </button>
      <button type="button" data-weather="storm" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M6 13a4 4 0 1 1 .5-8A5.5 5.5 0 0 1 17 7a3 3 0 0 1 1 6h-2M12 10l-4 6h5l-2 6 6-8h-5l3-4"
          /></svg
        ><span data-i18n="storm">雷暴</span>
      </button>
    </div>
    <div class="tools">
      <div class="modes" role="group" aria-label="操作模式">
        <button
          type="button"
          data-mode="observe"
          aria-pressed="true"
          data-i18n="observe"
        >
          转动观察</button
        ><button
          type="button"
          data-mode="wipe"
          aria-pressed="false"
          data-i18n="wipe"
        >
          擦拭雾气
        </button>
      </div>
      <button class="quiet" data-bottle-part="shake" type="button" data-i18n="shake">
        轻摇一下</button
      ><button class="quiet" data-bottle-part="reset" type="button" data-i18n="reset">
        回正</button
      ><button
        class="quiet"
        data-bottle-part="pause"
        type="button"
        aria-pressed="false"
        data-i18n="pause"
      >
        暂停
      </button>
    </div>
    <p data-bottle-part="hint">拖动旋转与倾斜 · 快速往返摇出一场雪 · 方向键也可观察</p>
  </div>
  <span class="corner" aria-hidden="true">a small pause in your day</span>
  <div data-bottle-part="message" role="status">
    <p data-bottle-part="message-text">正在装入一小片天气…</p>
    <button data-bottle-part="retry" type="button" hidden>重新加载</button>
  </div>
  <noscript
    ><style>
      .weather-scene [data-bottle-part=message] {
        display: none;
      }
    </style>
    <p style="position: relative; z-index: 10; padding: 30px">
      请启用 JavaScript 以查看天气玻璃瓶。Please enable JavaScript to use
      this scene.
    </p></noscript
  >
</div>
